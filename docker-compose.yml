name: lifegather

services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${LIFEGATHER_PORT:-8787}:8000"
    environment:
      LIFEGATHER_APP_NAME: "${LIFEGATHER_APP_NAME:-LifeGather}"
      LIFEGATHER_DATA_DIR: /data
      LIFEGATHER_STATIC_DIR: /app/static
    volumes:
      - lifegather-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  lifegather-data:
