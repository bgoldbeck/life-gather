# Ready-built image: no source checkout, Python, Node.js or local build needed.
services:
  backend:
    image: ghcr.io/bgoldbeck/life-gather:latest
    pull_policy: always
    ports:
      - "127.0.0.1:8787:8000"
    environment:
      LIFEGATHER_DATA_DIR: /data
      LIFEGATHER_STATIC_DIR: /app/static
    volumes:
      - lifegather-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  lifegather-data:
