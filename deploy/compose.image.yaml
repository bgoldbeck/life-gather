# Ready-built image: no source checkout, Python, Node.js or local build needed.
services:
  backend:
    image: ghcr.io/bgoldbeck/life-gather:latest
    pull_policy: always
    ports:
      - "0.0.0.0:8787:8787"
    environment:
      LIFEGATHER_DATA_DIR: /data
      LIFEGATHER_TEST_LOGIN_ENABLED: "${LIFEGATHER_TEST_LOGIN_ENABLED:-false}"
      LIFEGATHER_STATIC_DIR: /app/static
      LIFEGATHER_PUBLIC_URL: "${LIFEGATHER_PUBLIC_URL:-http://127.0.0.1:8787}"
      LIFEGATHER_GOOGLE_CLIENT_ID: "${LIFEGATHER_GOOGLE_CLIENT_ID:-}"
      LIFEGATHER_GOOGLE_CLIENT_SECRET: "${LIFEGATHER_GOOGLE_CLIENT_SECRET:-}"
      LIFEGATHER_SMTP_HOST: "${LIFEGATHER_SMTP_HOST:-}"
      LIFEGATHER_SMTP_PORT: "${LIFEGATHER_SMTP_PORT:-587}"
      LIFEGATHER_SMTP_USERNAME: "${LIFEGATHER_SMTP_USERNAME:-}"
      LIFEGATHER_SMTP_PASSWORD: "${LIFEGATHER_SMTP_PASSWORD:-}"
      LIFEGATHER_SMTP_SENDER: "${LIFEGATHER_SMTP_SENDER:-}"
      LIFEGATHER_SMTP_IMPLICIT_TLS: "${LIFEGATHER_SMTP_IMPLICIT_TLS:-false}"
    volumes:
      - lifegather-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  lifegather-data:
