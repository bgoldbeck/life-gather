name: Verify and publish container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bgoldbeck/life-gather

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Check backend
        working-directory: backend
        run: |
          uv sync --locked
          uv run --locked pytest
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run format:check
          npm run build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Linux image for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lifegather-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Private self-hosted personal-memory application
      - name: Verify the running image
        run: |
          docker run --detach --name lifegather-ci --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --mount type=volume,source=lifegather-ci-data,target=/data \
            --cap-drop ALL --security-opt no-new-privileges:true \
            "lifegather-ci:${GITHUB_SHA}"
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' lifegather-ci)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ]; then docker logs lifegather-ci; exit 1; fi
            sleep 2
          done
          if [ "$status" != healthy ]; then docker logs lifegather-ci; exit 1; fi
          docker exec -i lifegather-ci python - <<'PY'
          import json
          import os
          import shutil
          import urllib.request
          from pathlib import Path

          assert os.getuid() == 10001
          assert shutil.which('node') is None
          with urllib.request.urlopen('http://127.0.0.1:8787/health') as response:
              assert response.status == 200
              assert json.load(response) == {'status': 'ok'}
          with urllib.request.urlopen('http://127.0.0.1:8787/') as response:
              assert b'<title>LifeGather</title>' in response.read()
          with urllib.request.urlopen('http://127.0.0.1:8787/brand/lifegather-icon.png') as response:
              assert response.read(8) == b'\x89PNG\r\n\x1a\n'
          probe = Path('/data/.ci-probe')
          probe.write_text('synthetic probe')
          probe.unlink()
          print('Container health, frontend, icon, runtime user and data access verified.')
          PY
      - name: Save the verified image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save "lifegather-ci:${GITHUB_SHA}" | gzip > verified-image.tar.gz
      - name: Transfer the verified image to publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-image
          path: verified-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Clean up verification container
        if: always()
        run: |
          docker rm --force lifegather-ci || true
          docker volume rm lifegather-ci-data || true

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the verified image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-image
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed verification
        run: |
          docker load --input verified-image.tar.gz
          docker tag "lifegather-ci:${GITHUB_SHA}" "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker tag "lifegather-ci:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
          echo "Published ${IMAGE_NAME}:latest and ${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
